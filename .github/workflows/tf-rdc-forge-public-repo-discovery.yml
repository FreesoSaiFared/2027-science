name: TF RDC Forge Public Repo Discovery

on:
  push:
    branches:
      - tf/i9es-anything-analyzer-phase1
    paths:
      - .github/workflows/tf-rdc-forge-public-repo-discovery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover public Forgejo mirrors through HTML only
        shell: bash
        run: |
          set -euo pipefail
          base=https://rdc.transductive.art
          echo 'SCHEMA=TF_RDC_FORGE_PUBLIC_REPO_DISCOVERY/1'
          for q in 2027-science tf-local-executor comfyui torsionfield; do
            echo "===== QUERY=$q ====="
            curl -ksS --connect-timeout 5 --max-time 15 "$base/explore/repos?q=$q" -o /tmp/page || true
            echo "BODY_BYTES=$(wc -c </tmp/page 2>/dev/null || echo 0)"
            grep -Eo 'href="/[^" ]+/[^" ]+"' /tmp/page 2>/dev/null | sed 's/^href="//;s/"$//' | sort -u | head -n 100 || true
            grep -Ei -C 2 "$q" /tmp/page 2>/dev/null | head -n 120 || true
          done
          echo 'PUBLIC_REPO_DISCOVERY_COMPLETE=1'
