name: TF Forge Mirror Control Plane Probe

on:
  push:
    branches:
      - tf/i9es-anything-analyzer-phase1
    paths:
      - .github/workflows/tf-forge-mirror-control-plane-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect anonymous Forgejo repository/action surface
        shell: bash
        run: |
          set -u
          base=https://git.torsionfield.de
          echo 'SCHEMA=TF_FORGE_MIRROR_CONTROL_PLANE/1'
          for u in \
            "$base/api/v1/version" \
            "$base/api/v1/repos/search?q=2027-science&limit=50" \
            "$base/api/v1/users/FreesoSaiFared/repos?limit=50" \
            "$base/api/v1/users/Gerson/repos?limit=50" \
            "$base/explore/repos?q=2027-science"
          do
            echo "===== $u ====="
            rm -f /tmp/h /tmp/b
            curl -ksS --connect-timeout 5 --max-time 15 -D /tmp/h -o /tmp/b "$u" || true
            sed -n '1,30p' /tmp/h 2>/dev/null || true
            echo "BODY_BYTES=$(wc -c </tmp/b 2>/dev/null || echo 0)"
            head -c 12000 /tmp/b 2>/dev/null || true
            echo
          done
          echo 'FORGE_MIRROR_PROBE_COMPLETE=1'
