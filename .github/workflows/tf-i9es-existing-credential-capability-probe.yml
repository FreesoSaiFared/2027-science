name: TF i9es Existing Credential Capability Probe

on:
  push:
    branches:
      - tf/i9es-anything-analyzer-phase1
    paths:
      - .github/workflows/tf-i9es-existing-credential-capability-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report only presence/absence of likely existing automation credentials
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          I9ES_SSH_PRIVATE_KEY: ${{ secrets.I9ES_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          echo 'SCHEMA=TF_I9ES_EXISTING_CREDENTIAL_CAPABILITY/1'
          for n in \
            TAILSCALE_AUTHKEY TS_AUTHKEY \
            TAILSCALE_OAUTH_CLIENT_ID TAILSCALE_OAUTH_SECRET \
            TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET \
            SSH_PRIVATE_KEY I9ES_SSH_PRIVATE_KEY DEPLOY_SSH_KEY SSH_KEY \
            CLOUDFLARE_API_TOKEN CF_API_TOKEN
          do
            if [ -n "${!n:-}" ]; then
              echo "$n=PRESENT"
            else
              echo "$n=ABSENT"
            fi
          done
          echo 'IMPORTANT=No credential contents were printed or transformed.'
